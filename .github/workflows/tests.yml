name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - run: python scripts/evaluate.py --mode D --split all --output offline-checks.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-contract-checks
          path: offline-checks.json
